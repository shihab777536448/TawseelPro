name: Build Tawseel Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          unzip -o TawseelPro-GitHub-Project.zip
          cp -a TawseelPro/. .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'


      - name: Add Xposed Maven repository
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("settings.gradle")
          s = p.read_text()

          if "api.xposed.info" not in s:
              pattern = r'(dependencyResolutionManagement\s*\{[\s\S]*?repositories\s*\{)'
              replacement = (
                  r'\1\n'
                  '            maven { url "https://api.xposed.info/" }\n'
                  '            maven { url "https://artifactory.appodeal.com/appodeal-public/" }'
              )
              s, count = re.subn(pattern, replacement, s, count=1)

              if count == 0:
                  raise SystemExit(
                      "Could not locate dependencyResolutionManagement repositories"
                  )

              p.write_text(s)

          print("Xposed repositories configured")
          PY

      - name: Build APK
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TawseelPro-module-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
